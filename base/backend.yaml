apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: backend
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: postgres-secrets
            - configMapRef:
                name: postgres-configmap
          env:
            - name: PORT
              value: "4000"
          resources:
            limits:
              memory: "256Mi"
              cpu: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
