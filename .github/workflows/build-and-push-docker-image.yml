name: Release - Build & Push Docker Image

on:
    push:
        tags:
            - "*/*"

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract service and version from tag
              id: vars
              run: |
                  TAG="${GITHUB_REF#refs/tags/}"
                  SERVICE="${TAG%%/*}"
                  VERSION="${TAG##*/}"

                  echo "service=$SERVICE" >> $GITHUB_OUTPUT
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ secrets.DOCKER_USERNAME }}/${{ steps.vars.outputs.service }}
                  tags: |
                      type=raw,value=${{ steps.vars.outputs.version }}
                      type=raw,value=latest

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: ./${{ steps.vars.outputs.service }}
                  file: ./${{ steps.vars.outputs.service }}/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ steps.vars.outputs.service }}
                  cache-to: type=gha,scope=${{ steps.vars.outputs.service }},mode=max
