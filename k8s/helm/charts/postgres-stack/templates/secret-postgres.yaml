# Put postgres secrets here
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres-stack.fullname" . }}-postgres-secrets
  labels:
    app.kubernetes.io/name: {{ include "postgres-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  postgres-user: {{ .Values.postgres.postgresUser | default "postgres" | b64enc }}
  postgres-password: {{ .Values.postgres.postgresPassword | default "postgres" | b64enc }}
  postgres-database: {{ .Values.postgres.postgresDatabase | default "postgres" | b64enc }}