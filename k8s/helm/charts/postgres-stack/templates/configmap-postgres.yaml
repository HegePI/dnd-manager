apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postgres-stack.fullname" . }}-init-sql
data:
  00-configure.sql: |
    ALTER SYSTEM SET listen_addresses TO '*';
    ALTER SYSTEM SET shared_buffers TO '128MB';
    ALTER SYSTEM SET max_connections TO '100';

  01-init.sql: |
    \c {{ .Values.postgres.postgresDatabase | default "postgres" }};

    -- Create extensions
    CREATE EXTENSION IF NOT EXISTS pg_graphql;

    -- Create anon role
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
        CREATE ROLE anon NOINHERIT;
      END IF;
    END$$;

    -- Create GraphQL wrapper function
    CREATE OR REPLACE FUNCTION public.graphql_rpc(payload json)
    RETURNS jsonb
    LANGUAGE plpgsql
    SECURITY DEFINER
    AS $$
    BEGIN
      RETURN graphql.resolve(payload->>'query');
    END;
    $$;

    GRANT EXECUTE ON FUNCTION public.graphql_rpc(json) TO anon;

  02-pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    # "local" is for Unix domain socket connections only
    local   all             all                                     trust
    # IPv4 local connections:
    host    all             all             127.0.0.1/32           trust
    # IPv6 local connections:
    host    all             all             ::1/128                 trust
    # Allow replication connections from localhost
    host replication all    127.0.0.1/32    trust
    host replication all    ::1/128         trust
    # Allow from within k8s
    host    all             all             0.0.0.0/0              md5

  03-postgresql.conf: |
    # Custom PostgreSQL Configuration
    listen_addresses = '*'
    port = 5432
    max_connections = 100
    shared_buffers = 128MB
    dynamic_shared_memory_type = posix
    log_timezone = 'Etc/UTC'
    datestyle = 'iso, mdy'
    timezone = 'Etc/UTC'
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'
    default_text_search_config = 'pg_catalog.english'
    