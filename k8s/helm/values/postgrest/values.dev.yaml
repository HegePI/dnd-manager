# Development override values for PostgREST
replicaCount: 1

image:
  repository: postgrest/postgrest
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

env:
  # Connect to the Bitnami PostgreSQL release named 'postgresql'
  dbUri: "postgres://dnd:password@postgresql:5432/dnd"
  dbAnonRole: "anon"
  dbSchemas: "public,graphql"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: postgrest.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
 