apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dnd-manager-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: dnd-manager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api/graphql
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
