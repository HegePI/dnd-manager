apiVersion: skaffold/v4beta10
kind: Config
metadata:
  name: dnd-manager
build:
  local:
    concurrency: 0
    tryImportMissing: false
    useDockerCLI: false
  artifacts:
    - image: backend
      context: backend
      docker:
        dockerfile: Dockerfile
    - image: frontend
      context: frontend
      docker:
        dockerfile: Dockerfile
manifests:
  kustomize:
    paths:
      - k8s/dev
deploy:
  helm:
    releases:
      - name: postgresql
        remoteChart: bitnami/postgresql
        valuesFiles:
          - k8s/helm/values/postgresql/postgresql.dev.yaml
      - name: kubeai
        remoteChart: kubeai/kubeai
        valuesFiles:
          - k8s/helm/values/kubeai/kubeai.yaml
      - name: kubeai-models
        remoteChart: kubeai/models
        valuesFiles:
          - k8s/helm/values/kubeai/models.yaml
  kubectl: {}
