apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: dnd-manager
build:
  local:
    concurrency: 0
    tryImportMissing: false
    useDockerCLI: false
  artifacts:
    - image: hegepi/pg-graphql-postgres
      context: pg-graphql-postgres
      docker:
        dockerfile: Dockerfile
    - image: backend
      context: backend
      docker:
        dockerfile: Dockerfile
    - image: frontend
      context: frontend
      docker:
        dockerfile: Dockerfile
deploy:
  helm:
    releases:
      - name: postgres-stack
        chartPath: k8s/helm/charts/postgres-stack
        valuesFiles:
          - k8s/helm/values/postgres-stack/values.dev.yaml
      - name: backend
        chartPath: k8s/helm/charts/backend
        valuesFiles:
          - "k8s/helm/values/backend/values.dev.yaml"
      - name: frontend
        chartPath: k8s/helm/charts/frontend
        valuesFiles:
          - "k8s/helm/values/frontend/values.dev.yaml"
      - name: db-migration
        chartPath: k8s/helm/charts/db-migration
        valuesFiles:
          - "k8s/helm/values/db-migration/values.dev.yaml"
