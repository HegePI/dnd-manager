apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: dnd-manager
build:
  local:
    push: true
    concurrency: 0
    tryImportMissing: false
    useDockerCLI: false
  artifacts:
    - image: backend
      context: backend
      docker:
        dockerfile: Dockerfile
    - image: frontend
      context: frontend
      docker:
        dockerfile: Dockerfile
deploy:
  helm:
    releases:
      - name: postgresql
        remoteChart: bitnami/postgresql
        valuesFiles:
          - k8s/helm/values/postgresql/postgresql.dev.yaml
      - name: backend
        chartPath: k8s/helm/charts/backend
        valuesFiles:
          - "k8s/helm/values/backend/values.dev.yaml"
      - name: frontend
        chartPath: k8s/helm/charts/frontend
        valuesFiles:
          - "k8s/helm/values/frontend/values.dev.yaml"
